<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Feedback</title>

<style>
body{
text-align:center;
padding:40px;
color:white;
background:linear-gradient(45deg,#0f2027,#203a43,#2c5364);
font-family:Arial, sans-serif;
}

.container{
max-width:600px;
margin:auto;
}

input, textarea{
width:100%;
padding:10px;
margin-top:10px;
border-radius:8px;
border:none;
}

button{
padding:12px 20px;
border:none;
border-radius:10px;
cursor:pointer;
background:#00c3ff;
color:white;
font-weight:bold;
margin-top:12px;
}

.box{
background:rgba(255,255,255,0.1);
padding:15px;
margin-top:15px;
border-radius:10px;
text-align:left;
}
</style>

</head>

<body><h2>💬 Deixe seu feedback</h2>

<iframe src="https://docs.google.com/forms/d/e/1FAIpQLSe-g7NtJxhgbqp8bwY4glbDwjHxHnjX9V1KZ7ED3jrIMs56AQ/viewform?embedded=true"
width="100%"
height="600"
style="border:none;border-radius:10px;">
</iframe>

<nav>
<a href="index.html" style="color:white;text-decoration:none;margin:10px;">Home</a> |
<a href="sobre.html" style="color:white;text-decoration:none;margin:10px;">Sobre</a> |
<a href="servicos.html" style="color:white;text-decoration:none;margin:10px;">O que fazemos</a> |
<a href="feedback.html" style="color:white;text-decoration:none;margin:10px;">Feedback</a>
</nav>

<h1>💬 Feedback</h1>

<div class="container">

<input id="nome" placeholder="Seu nome">

<textarea id="msg" placeholder="Escreva sua mensagem"></textarea>

<button onclick="enviar()">Enviar</button>

<div id="lista"></div>

</div>

<script>
function enviar(){

let nome = document.getElementById("nome").value;
let msg = document.getElementById("msg").value;

if(nome.trim()=="" || msg.trim()==""){
alert("Preencha todos os campos!");
return;
}

let div = document.createElement("div");
div.className = "box";

div.innerHTML = "<b>"+nome+"</b><br>"+msg;

document.getElementById("lista").prepend(div);

document.getElementById("nome").value="";
document.getElementById("msg").value="";
}
</script>

</body>
</html>
