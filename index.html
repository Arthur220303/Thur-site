<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Thurtech - Soluções Digitais. Criação de sites e serviços digitais.">
  <title>Thurtech | Soluções Digitais</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f0f0f, #1c1c1c);
      color: white;
      text-align: center;
    }

    header {
      padding: 20px;
      background: #000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    /* LOGO NEON */
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #00ff88;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow:
        0 0 5px #00ff88,
        0 0 10px #00ff88,
        0 0 20px #00ff88,
        0 0 40px #00cc6a;
      animation: brilho 1.5s infinite alternate;
    }

    @keyframes brilho {
      from {
        text-shadow:
          0 0 5px #00ff88,
          0 0 10px #00ff88,
          0 0 20px #00ff88,
          0 0 40px #00cc6a;
      }
      to {
        text-shadow:
          0 0 10px #00ff88,
          0 0 20px #00ff88,
          0 0 30px #00ff88,
          0 0 60px #00cc6a;
      }
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 15px;
      transition: 0.3s;
    }

    nav a i {
      margin-right: 6px;
    }

    nav a:hover {
      color: #00ff88;
    }

    .hero {
      padding: 80px 20px;
    }

    .hero h2 {
      font-size: 32px;
      margin-bottom: 20px;
    }

    .hero p {
      max-width: 600px;
      margin: auto;
      margin-bottom: 30px;
      color: #ccc;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      padding: 12px 25px;
      background: #00ff88;
      color: #000;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      transition: 0.3s;
    }

    .btn:hover {
      background: #00cc6a;
    }

    footer {
      margin-top: 80px;
      padding: 20px;
      background: #000;
      font-size: 14px;
      color: #888;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
      }

      nav {
        margin-top: 10px;
      }

      nav a {
        margin: 0 10px;
      }

      .hero h2 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">THURTECH</div>
    <nav>
      <a href="https://instagram.com/seuusuario" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-instagram"></i>Instagram
      </a>

      <a href="https://wa.me/5548996045175?text=Olá,%20vim%20pelo%20site%20da%20Thurtech%20e%20quero%20um%20orçamento." target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-whatsapp"></i>WhatsApp
      </a>
    </nav>
  </header>

  <section class="hero">
    <h2>Transformando Ideias em Soluções Digitais</h2>
    <p>
      Criamos sites modernos, artes para redes sociais e soluções digitais
      que ajudam sua marca a crescer no ambiente online.
    </p>
    <a href="https://wa.me/5548996045175?text=Olá,%20vim%20pelo%20site%20da%20Thurtech%20e%20quero%20um%20orçamento." 
       class="btn" target="_blank">
       Solicitar Orçamento
    </a>
  </section>

  <footer>
    © 2026 Thurtech - Todos os direitos reservados
  </footer>

</body>
</html>
