<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>ThurTech</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

/* BODY */
body{
    background: linear-gradient(45deg,#0f2027,#203a43,#2c5364);
    color:white;
}

/* NAVBAR */
nav{
    width:100%;
    padding:20px;
    display:flex;
    justify-content:center;
    background:rgba(0,0,0,0.2);
    backdrop-filter: blur(8px);
}

nav h2{
    font-size:28px;
}

/* CONTEÚDO */
.container{
    height:90vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

h1{
    font-size:70px;
    margin-bottom:20px;
}

p{
    font-size:22px;
    opacity:0.9;
    margin-bottom:40px;
}

/* BOTÃO */
button{
    padding:16px 40px;
    font-size:18px;
    border:none;
    border-radius:40px;
    background:#00c6ff;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#0072ff;
    transform:scale(1.08);
}

</style>

</head>

<body>

<nav>
<h2>ThurTech</h2>
</nav>

<div class="container">

<h1>ThurTech</h1>

<p>Desenvolvendo tecnologia simples e gratuita</p>

<button onclick="alert('Bem-vindo à ThurTech!')">
Entrar no site
</button>

</div>

</body>
</html>
