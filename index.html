<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Thurtech</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
font-family:Arial, sans-serif;
text-align:center;
}

.container{
animation:fadeIn 1.5s ease;
}

h1{
font-size:80px;
letter-spacing:10px;
margin-bottom:20px;
}

p{
opacity:0.85;
margin-bottom:40px;
font-size:20px;
}

button{
padding:16px 55px;
font-size:22px;
border:none;
border-radius:25px;
cursor:pointer;
background:#00c3ff;
color:white;
font-weight:bold;
transition:0.3s;
box-shadow:0 0 15px rgba(0,195,255,0.4);
}

button:hover{
transform:scale(1.1);
background:#0099cc;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(30px);}
to{opacity:1; transform:translateY(0);}
}

</style>

</head>

<body>

<div class="container">

<h1>THURTECH</h1>

<p>Desenvolvimento web moderno para suas ideias</p>

<a href="servicos.html">
<button>ENTRAR</button>
</a>

</div>

</body>
</html>
